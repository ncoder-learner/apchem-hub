name: Validate AP Chem Hub

on:
  pull_request:
  push:
    branches:
      - master
      - curriculum/rebuild-all-lessons
      - feature/frq-workspace-readable-solutions

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check TypeScript
        run: npm run typecheck

      - name: Build production site
        run: npm run build
